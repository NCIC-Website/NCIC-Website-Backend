---
deployment:
  tasks:
    # Set deployment path
    - export DEPLOYPATH=/home/newcreb/ncic-backend
    # Create deployment directory if it doesn't exist
    - mkdir -p $DEPLOYPATH
    # Copy files to deployment directory (exclude node_modules and .git)
    - rsync -av --exclude='node_modules' --exclude='.git' --exclude='*.log' . $DEPLOYPATH/
    - cd $DEPLOYPATH
    # Use the JavaScript version to avoid TypeScript issues
    - cp src/index.js src/app.js || true
    # Install only essential production dependencies
    - npm install express mongoose dotenv bcrypt jsonwebtoken nodemailer --save --production
    # Start with basic node (works with any Node version)
    - pkill -f "node.*index" || true
    - nohup node src/index.js > server.log 2>&1 &
    - echo "Backend started with PID: $!"
