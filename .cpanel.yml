---
deployment:
  tasks:
    # Set deployment path
    - export DEPLOYPATH=/home/newcreb/ncic-backend
    # Create deployment directory if it doesn't exist
    - mkdir -p $DEPLOYPATH
    # Copy files to deployment directory (exclude node_modules and .git)
    - rsync -av --exclude='node_modules' --exclude='.git' --exclude='*.log' . $DEPLOYPATH/
    - cd $DEPLOYPATH
    # Try multiple Node.js versions in order of preference
    - export PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH || export PATH=/opt/alt/alt-nodejs18/root/usr/bin:$PATH || export PATH=/opt/alt/alt-nodejs16/root/usr/bin:$PATH || true
    - node --version
    - npm --version
    # Install dependencies with legacy peer deps for compatibility
    - npm install --production --legacy-peer-deps
    # Install global dependencies with correct Node path
    - npm install -g typescript ts-node pm2 || true
    # Stop existing process if running
    - pm2 stop ncic-backend || true
    # Delete old process if exists
    - pm2 delete ncic-backend || true
    # Start with TypeScript directly using ts-node
    - pm2 start src/index.ts --name ncic-backend --interpreter ts-node
    # Save PM2 configuration
    - pm2 save || true
    # Setup auto-restart on server reboot
    - pm2 startup || true
